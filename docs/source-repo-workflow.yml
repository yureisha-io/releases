# COPY ME into the private app repo as .github/workflows/release-direct.yml (see docs/publishing.md).
# DRAFT: needs the operator's secrets before it can run. Nothing here holds a secret value.
#
# Build → sign (Developer ID) → notarize → staple → hand to yureisha-io/releases.
# On a v* tag (or a manual run) it builds Yureisha.app for arm64 only, signs it with the Developer ID Application
# certificate, notarizes and staples the app, wraps it in Yureisha.dmg, signs, notarizes and staples the DMG, verifies
# it, uploads it as the artifact `yureisha-dmg`, then sends repository_dispatch `yureisha-release` to the releases repo,
# whose publish.yml verifies it again and publishes it.
#
# Runner: macos-15 is Apple silicon (arm64). Never use an Intel (macos-13 / *-large) or Linux runner.
#
# Secrets in yureisha-io/yureisha (names only):
#   APPLE_TEAM_ID                           Developer ID team id (10 characters)
#   DEVELOPER_ID_APPLICATION_P12            base64 of the "Developer ID Application: Black Mesa Lab (TEAMID)" .p12
#   DEVELOPER_ID_APPLICATION_P12_PASSWORD   its export password
#   NOTARY_API_KEY_ID                       App Store Connect API key id (Developer role is enough for notarytool)
#   NOTARY_API_ISSUER_ID                    its issuer id
#   NOTARY_API_KEY_P8                       base64 of the AuthKey_<id>.p8 file
#   RELEASES_DISPATCH_TOKEN                 fine-grained token with Contents: read & write on yureisha-io/releases
#                                           (repository_dispatch needs it); nothing else
# The notary API key is stored in a temporary keychain as the notarytool keychain profile "yureisha-notary"
# (NOTARY_KEYCHAIN_PROFILE below), so later steps never pass the key on the command line.
name: Release (direct download)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version, e.g. 1.0.0 (defaults to the tag without the v)"
        required: false
      draft:
        description: "Ask the releases repo to create a draft release"
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: release-direct
  cancel-in-progress: false

jobs:
  build-sign-notarize:
    runs-on: macos-15   # arm64 (Apple silicon)
    timeout-minutes: 90
    env:
      NOTARY_KEYCHAIN_PROFILE: yureisha-notary
      KEYCHAIN: ${{ github.workspace }}/../build.keychain-db
      VERSION_IN: ${{ inputs.version }}
      DRAFT_IN: ${{ github.event_name != 'workflow_dispatch' || inputs.draft }}   # tag pushes: always a draft
    steps:
      - name: Require Apple silicon and Darwin
        run: test "$(uname -s)" = Darwin && test "$(uname -m)" = arm64

      - uses: actions/checkout@v4

      - name: Version and build number
        run: |
          v="${VERSION_IN:-${GITHUB_REF_NAME#v}}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::bad version '$v'"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "BUILD=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"   # monotonic; Sparkle compares CFBundleVersion

      - name: Temporary keychain with the Developer ID certificate and notary profile
        env:
          P12: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
        run: |
          set -euo pipefail
          KC_PASS=$(uuidgen)
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          umask 077
          printf '%s' "$P12" | base64 -D > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          printf '%s' "$NOTARY_API_KEY_P8" | base64 -D > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials "$NOTARY_KEYCHAIN_PROFILE" --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$NOTARY_API_KEY_ID" --issuer "$NOTARY_API_ISSUER_ID" --keychain "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/AuthKey.p8"

      - name: Build the bundled helper (yurei-tap, arm64)
        run: swift build -c release --arch arm64 --product yurei-tap

      - name: Archive Yureisha.app (arm64 only, Developer ID, hardened runtime)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # App/Yureisha.xcodeproj is generated by XcodeGen from App/project.yml; regenerate if it isn't committed.
          xcodebuild archive \
            -project App/Yureisha.xcodeproj -scheme Yureisha -configuration Release \
            -destination 'generic/platform=macOS' -archivePath "$RUNNER_TEMP/Yureisha.xcarchive" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Developer ID Application" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--timestamp --options=runtime --keychain $KEYCHAIN" ENABLE_HARDENED_RUNTIME=YES
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>developer-id</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Developer ID Application</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Yureisha.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export"
          echo "APP=$RUNNER_TEMP/export/Yureisha.app" >> "$GITHUB_ENV"

      - name: Notarize and staple the app
        run: |
          set -euo pipefail
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/Yureisha-app.zip"
          xcrun notarytool submit "$RUNNER_TEMP/Yureisha-app.zip" --keychain-profile "$NOTARY_KEYCHAIN_PROFILE" \
            --keychain "$KEYCHAIN" --wait --timeout 30m
          xcrun stapler staple "$APP"

      - name: Build, sign, notarize and staple Yureisha.dmg
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # Plain layout (app + Applications link). The branded window (Branding/yureisha/dmg-background*,
          # icon centres per BRAND.md §12) can be added later with a Finder layout step.
          STAGE="$RUNNER_TEMP/dmg"; mkdir -p "$STAGE"
          ditto "$APP" "$STAGE/Yureisha.app"
          ln -s /Applications "$STAGE/Applications"
          mkdir -p dist
          hdiutil create -volname "Yureisha" -srcfolder "$STAGE" -fs APFS -format UDZO -ov dist/Yureisha.dmg
          codesign --sign "Developer ID Application" --keychain "$KEYCHAIN" --timestamp dist/Yureisha.dmg
          xcrun notarytool submit dist/Yureisha.dmg --keychain-profile "$NOTARY_KEYCHAIN_PROFILE" \
            --keychain "$KEYCHAIN" --wait --timeout 30m
          xcrun stapler staple dist/Yureisha.dmg

      - name: Verify (same checks the releases repo runs)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          codesign --verify --strict --verbose=2 dist/Yureisha.dmg
          spctl -a -t open --context context:primary-signature -v dist/Yureisha.dmg
          xcrun stapler validate dist/Yureisha.dmg
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -q "^TeamIdentifier=$APPLE_TEAM_ID$"
          spctl -a -t exec -vv "$APP"
          xcrun stapler validate "$APP"
          [ "$(lipo -archs "$APP/Contents/MacOS/Yureisha")" = "arm64" ]
          shasum -a 256 dist/Yureisha.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: yureisha-dmg
          path: dist/Yureisha.dmg
          if-no-files-found: error
          retention-days: 7

      - name: Hand off to yureisha-io/releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_DISPATCH_TOKEN }}
        run: |
          jq -n --arg v "$VERSION" --arg b "$BUILD" --arg r "$GITHUB_RUN_ID" --argjson d "$DRAFT_IN" \
            '{event_type: "yureisha-release", client_payload: {version: $v, build: $b, source_run_id: $r, draft: $d}}' \
          | gh api repos/yureisha-io/releases/dispatches --input -

      - name: Remove the temporary keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" || true
