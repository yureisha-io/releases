# DRAFT (see publish.yml and docs/publishing.md).
# Adds a release to appcast.xml when it is published by hand, e.g. when the operator publishes a draft created by
# publish.yml. (Releases that publish.yml creates as non-drafts are added there directly: events made with the
# workflow's own GITHUB_TOKEN don't trigger this workflow.)
name: Add published release to appcast

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.0"
        required: true

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  appcast:
    runs-on: macos-15   # arm64 (Apple silicon)
    timeout-minutes: 15
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      SPARKLE_ENABLED: ${{ vars.SPARKLE_ENABLED }}
      SPARKLE_VERSION: "2.6.4"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require Apple silicon and Darwin
        run: test "$(uname -s)" = Darwin && test "$(uname -m)" = arm64

      - name: Validate tag
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::bad tag"; exit 1; }'

      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Skip if already in the feed
        run: |
          if grep -q "/releases/download/$TAG/Yureisha.dmg" appcast.xml; then
            echo "$TAG already in appcast.xml"; echo "SKIP=true" >> "$GITHUB_ENV"
          fi

      - name: Download the release's DMG and check its checksum
        if: env.SKIP != 'true'
        run: |
          set -euo pipefail
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p Yureisha.dmg -p Yureisha.dmg.sha256 -D dist
          (cd dist && shasum -a 256 -c Yureisha.dmg.sha256)
          xcrun stapler validate dist/Yureisha.dmg
          scripts/bundle-info.sh dist/Yureisha.dmg >> "$GITHUB_ENV"
          echo "LENGTH=$(stat -f%z dist/Yureisha.dmg)" >> "$GITHUB_ENV"

      - name: Sparkle EdDSA signature
        if: env.SKIP != 'true'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          sig=$(scripts/sparkle-sign.sh dist/Yureisha.dmg)
          echo "ED_SIGNATURE=$sig" >> "$GITHUB_ENV"

      - name: Update appcast.xml
        if: env.SKIP != 'true'
        run: |
          set -euo pipefail
          [ "v$VERSION" = "$TAG" ] || { echo "::error::bundle version $VERSION doesn't match $TAG"; exit 1; }
          python3 scripts/appcast.py --version "$VERSION" --build "$BUILD" --length "$LENGTH" \
            --min-macos "$MIN_MACOS" --ed-signature "$ED_SIGNATURE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "chore(appcast): publish $TAG"
          git push origin HEAD:main
