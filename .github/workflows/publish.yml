# DRAFT: not usable until the operator adds the secrets below and decides on Sparkle (docs/publishing.md).
#
# Publishes a direct-download release of Yureisha. The private app repo (yureisha-io/yureisha) builds, signs with the
# Developer ID, notarizes and staples Yureisha.dmg, uploads it as the artifact `yureisha-dmg`, then sends a
# repository_dispatch (event type `yureisha-release`) here. This workflow never signs or builds the app: it downloads
# that artifact, verifies it independently, creates the GitHub Release and updates appcast.xml.
#
# Runner: macos-15 is Apple silicon (arm64). Never use an Intel (macos-13 / *-large) or Linux runner here.
#
# Secrets (names only; values are never stored in this repo):
#   YUREISHA_SOURCE_TOKEN   fine-grained token (or GitHub App token) with Actions: read on yureisha-io/yureisha,
#                           used only to download the build artifact from the private repo.
#   APPLE_TEAM_ID           the Developer ID team id; the DMG and app must be signed by this team.
#   SPARKLE_ED_PRIVATE_KEY  Sparkle EdDSA private key (base64, from Sparkle's generate_keys). Only read when the
#                           repo variable SPARKLE_ENABLED is "true".
# Variables:
#   SPARKLE_ENABLED         "true" once the app ships Sparkle with the matching SUPublicEDKey. Otherwise items are
#                           written with sparkle:edSignature="ED_SIGNATURE_PLACEHOLDER".
name: Publish release (draft pipeline)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version, e.g. 1.0.0 (tag will be v<version>)"
        required: true
      build:
        description: "Build number (CFBundleVersion)"
        required: true
      source_run_id:
        description: "Run id in yureisha-io/yureisha that uploaded the yureisha-dmg artifact"
        required: true
      draft:
        description: "Create the GitHub Release as a draft (appcast is only updated for published releases)"
        type: boolean
        default: true
  repository_dispatch:
    types: [yureisha-release]   # client_payload: {version, build, source_run_id, draft}

permissions:
  contents: write   # create the release and commit appcast.xml

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-15   # arm64 (Apple silicon)
    timeout-minutes: 30
    env:
      # Untrusted inputs go through env and are validated below, never interpolated into scripts.
      VERSION: ${{ inputs.version || github.event.client_payload.version }}
      BUILD: ${{ inputs.build || github.event.client_payload.build }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id || github.event.client_payload.source_run_id }}
      INPUT_DRAFT: ${{ inputs.draft }}
      PAYLOAD_DRAFT: ${{ github.event.client_payload.draft }}
      SPARKLE_ENABLED: ${{ vars.SPARKLE_ENABLED }}
      SPARKLE_VERSION: "2.6.4"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require Apple silicon and Darwin
        run: |
          test "$(uname -s)" = Darwin && test "$(uname -m)" = arm64 || { echo "::error::runner must be macOS arm64"; exit 1; }

      - name: Validate inputs
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::bad version '$VERSION'"; exit 1; }
          [[ "$BUILD" =~ ^[0-9]+(\.[0-9]+)*$ ]] || { echo "::error::bad build '$BUILD'"; exit 1; }
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::bad source_run_id"; exit 1; }
          # Default to a draft release unless the caller explicitly said false.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then DRAFT_IN="$INPUT_DRAFT"; else DRAFT_IN="$PAYLOAD_DRAFT"; fi
          if [ "$DRAFT_IN" = "false" ]; then echo "DRAFT=false" >> "$GITHUB_ENV"; else echo "DRAFT=true" >> "$GITHUB_ENV"; fi
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          if gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release v$VERSION already exists"; exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download the signed DMG from the app repo
        uses: actions/download-artifact@v4
        with:
          name: yureisha-dmg
          repository: yureisha-io/yureisha
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.YUREISHA_SOURCE_TOKEN }}
          path: dist

      - name: Verify signature, notarization, staple and architecture
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          DMG=dist/Yureisha.dmg
          test -f "$DMG" || { echo "::error::artifact has no Yureisha.dmg"; exit 1; }
          test -n "$APPLE_TEAM_ID" || { echo "::error::APPLE_TEAM_ID secret is not set"; exit 1; }

          # The disk image itself
          codesign --verify --strict --verbose=2 "$DMG"
          codesign -dv --verbose=4 "$DMG" 2>&1 | grep -q "^TeamIdentifier=$APPLE_TEAM_ID$"
          spctl -a -t open --context context:primary-signature -v "$DMG" 2>&1 | tee /dev/stderr | grep -q "Notarized Developer ID"
          xcrun stapler validate "$DMG"

          # The app inside it
          MNT=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -noautoopen -mountpoint "$MNT" "$DMG" >/dev/null
          trap 'hdiutil detach "$MNT" -quiet || true' EXIT
          APP="$MNT/Yureisha.app"
          test -d "$APP" || { echo "::error::Yureisha.app not found at the DMG root"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -q "^Authority=Developer ID Application:"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -q "^TeamIdentifier=$APPLE_TEAM_ID$"
          codesign -d --entitlements - "$APP" >/dev/null
          spctl -a -t exec -vv "$APP" 2>&1 | tee /dev/stderr | grep -q "Notarized Developer ID"
          xcrun stapler validate "$APP"

          # Apple silicon only: every Mach-O in the bundle must be arm64 and nothing else.
          bad=0
          while IFS= read -r -d '' f; do
            if file -b "$f" | grep -q "Mach-O"; then
              archs=$(lipo -archs "$f" 2>/dev/null || echo "?")
              [ "$archs" = "arm64" ] || { echo "::error::$f is '$archs', expected arm64 only"; bad=1; }
            fi
          done < <(find "$APP" -type f -perm +111 -print0)
          [ "$bad" = 0 ]

          # Version in the bundle must match the dispatch
          PLIST="$APP/Contents/Info.plist"
          short=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST")
          build=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST")
          [ "$short" = "$VERSION" ] || { echo "::error::bundle version $short != $VERSION"; exit 1; }
          [ "$build" = "$BUILD" ] || { echo "::error::bundle build $build != $BUILD"; exit 1; }
          echo "MIN_MACOS=$(/usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$PLIST")" >> "$GITHUB_ENV"

      - name: Checksum
        working-directory: dist
        run: |
          shasum -a 256 Yureisha.dmg | tee Yureisha.dmg.sha256
          echo "SHA256=$(cut -d' ' -f1 Yureisha.dmg.sha256)" >> "$GITHUB_ENV"
          echo "LENGTH=$(stat -f%z Yureisha.dmg)" >> "$GITHUB_ENV"

      - name: Sparkle EdDSA signature
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          sig=$(scripts/sparkle-sign.sh dist/Yureisha.dmg)
          echo "ED_SIGNATURE=$sig" >> "$GITHUB_ENV"

      - name: Release notes
        run: |
          sed -e "s/{{VERSION}}/$VERSION/g" -e "s/{{BUILD}}/$BUILD/g" -e "s/{{SHA256}}/$SHA256/g" -e "s/{{MIN_MACOS}}/$MIN_MACOS/g" \
            docs/release-notes-template.md | awk '/^<!--/{c=1} !c{print} /-->/{c=0}' > "$RUNNER_TEMP/notes.md"

      - name: Create the GitHub Release
        run: |
          flags=(--title "Yureisha $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --target main)
          [ "$DRAFT" = "true" ] && flags+=(--draft)
          # The asset name stays Yureisha.dmg so releases/latest/download/Yureisha.dmg (linked from yureisha.io) works.
          gh release create "$TAG" dist/Yureisha.dmg dist/Yureisha.dmg.sha256 "${flags[@]}"

      - name: Update appcast.xml
        # A draft's download URL isn't public, so don't advertise it yet. When the operator publishes the draft,
        # appcast.yml adds the item.
        if: env.DRAFT != 'true'
        run: |
          set -euo pipefail
          python3 scripts/appcast.py --version "$VERSION" --build "$BUILD" --length "$LENGTH" \
            --min-macos "$MIN_MACOS" --ed-signature "$ED_SIGNATURE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "chore(appcast): publish $TAG"
          git push origin HEAD:main
